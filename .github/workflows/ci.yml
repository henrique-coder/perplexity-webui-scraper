name: CI

on:
  push:
    branches:
      - dev
      - prod
  pull_request:
    branches:
      - dev
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_PYTHON: "3.14"

jobs:
  changes:
    name: Classify Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.classify.outputs.python }}
      documentation: ${{ steps.classify.outputs.documentation }}
      frontend: ${{ steps.classify.outputs.frontend }}
      workflows: ${{ steps.classify.outputs.workflows }}
      metadata: ${{ steps.classify.outputs.metadata }}
      containers: ${{ steps.classify.outputs.containers }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: ${{ env.CI_PYTHON }}
          enable-cache: false

      - name: Classify Changed Files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$BASE_REF" = "prod" ]; then
            uv run --python "$CI_PYTHON" --no-project python scripts/classify_ci_paths.py --all
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            uv run --python "$CI_PYTHON" --no-project python scripts/classify_ci_paths.py "$PR_BASE_SHA" "$PR_HEAD_SHA"
            exit 0
          fi

          if [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA" || git rev-parse "$HEAD_SHA^")
          else
            BASE_SHA="$EVENT_BEFORE"
          fi
          uv run --python "$CI_PYTHON" --no-project python scripts/classify_ci_paths.py "$BASE_SHA" "$HEAD_SHA"

  python_quality:
    name: Python Quality
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: ${{ env.CI_PYTHON }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: uv sync --frozen --python "$CI_PYTHON" --no-dev --extra all --group lint --group tests --group scripts

      - name: Check Code Quality
        run: |
          uv run --python "$CI_PYTHON" --no-sync ruff check
          uv run --python "$CI_PYTHON" --no-sync ruff format --check
          uv run --python "$CI_PYTHON" --no-sync ty check
          uv run --python "$CI_PYTHON" --no-sync python scripts/generate_model_docs.py --check

  documentation:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.documentation == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: ${{ env.CI_PYTHON }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: uv sync --frozen --python "$CI_PYTHON" --only-group docs --no-install-project

      - name: Build Documentation
        run: uv run --python "$CI_PYTHON" --no-sync zensical build --clean --strict

  formatting:
    name: Formatting & Configuration
    needs: changes
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.documentation == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.workflows == 'true' ||
      needs.changes.outputs.metadata == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.17.0
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check Formatting
        run: |
          pnpm prettier --check .
          pnpm taplo lint *.toml

  workflow_lint:
    name: Workflow Security
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: ${{ env.CI_PYTHON }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Workflow Linter
        run: uv sync --frozen --python "$CI_PYTHON" --only-group workflow --no-install-project

      - name: Scan Workflows
        run: uv run --python "$CI_PYTHON" --no-sync zizmor .github/workflows

  containers:
    name: Container Build
    needs: changes
    if: needs.changes.outputs.containers == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build API Image
        run: podman build -t perplexity-api-ci -f Containerfile .

      - name: Build MCP Image
        run: podman build -t perplexity-mcp-ci -f Containerfile.mcp .

      - name: Smoke Test API Image
        run: podman run --rm perplexity-api-ci --help

      - name: Smoke Test MCP Image
        run: podman run --rm perplexity-mcp-ci --help

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: uv sync --frozen --python "${{ matrix.python }}" --no-dev --extra all --group tests --group scripts

      - name: Run Test Suite
        run: uv run --python "${{ matrix.python }}" --no-sync pytest

  build:
    name: Build Distribution
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: ${{ env.CI_PYTHON }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build Package
        run: uv build --python "$CI_PYTHON"

      - name: Validate Package Metadata
        run: |
          uvx --python "$CI_PYTHON" twine check dist/*.whl dist/*.tar.gz
          PROJECT_VERSION=$(
            uv run --python "$CI_PYTHON" --no-project python -c \
              'from pathlib import Path; from tomllib import load; f = Path("pyproject.toml").open("rb"); print(load(f)["project"]["version"]); f.close()'
          )
          uv run --python "$CI_PYTHON" --no-project python scripts/verify_release_artifacts.py \
            --version "$PROJECT_VERSION" dist/*.whl dist/*.tar.gz

  release_policy:
    name: Release Policy
    if: github.event_name == 'pull_request' && github.base_ref == 'prod' && github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: ${{ env.CI_PYTHON }}
          enable-cache: false

      - name: Validate Release Version
        run: |
          uv run --python "$CI_PYTHON" --no-project python scripts/verify_release_policy.py
          PROJECT_VERSION=$(
            uv run --python "$CI_PYTHON" --no-project python -c \
              'from pathlib import Path; from tomllib import load; f = Path("pyproject.toml").open("rb"); print(load(f)["project"]["version"]); f.close()'
          )

          if git ls-remote --exit-code --tags origin "refs/tags/v$PROJECT_VERSION" >/dev/null; then
            echo "::error::Release tag v$PROJECT_VERSION already exists. Bump the version before promoting to prod."
            exit 1
          fi

  required:
    name: Code Quality & Tests
    if: always()
    timeout-minutes: 5
    needs:
      - changes
      - python_quality
      - documentation
      - formatting
      - workflow_lint
      - containers
      - tests
      - build
      - release_policy
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTHON_QUALITY_RESULT: ${{ needs.python_quality.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow_lint.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_POLICY_RESULT: ${{ needs.release_policy.result }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for result in \
            "$CHANGES_RESULT" \
            "$PYTHON_QUALITY_RESULT" \
            "$DOCUMENTATION_RESULT" \
            "$FORMATTING_RESULT" \
            "$WORKFLOW_LINT_RESULT" \
            "$CONTAINERS_RESULT" \
            "$TESTS_RESULT" \
            "$BUILD_RESULT" \
            "$RELEASE_POLICY_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::One or more required CI jobs failed."
              exit 1
            fi
          done

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::One or more required CI jobs failed."
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "prod" ] && [ "$HEAD_REF" = "dev" ] && [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            if [ "$RELEASE_POLICY_RESULT" != "success" ]; then
              echo "::error::The production release policy must pass on dev-to-prod pull requests."
              exit 1
            fi
          fi

          echo "All required checks passed."
