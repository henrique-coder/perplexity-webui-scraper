name: Publish Release

on:
  push:
    branches:
      - prod
    paths:
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release. Empty = auto-detect from source."
        required: false
        type: string
      skip_pypi:
        description: "Skip PyPI publish"
        required: false
        default: true
        type: boolean
      skip_docker:
        description: "Skip Docker publish"
        required: false
        default: true
        type: boolean
      skip_gh_releases:
        description: "Skip GitHub Release creation"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_version:
    name: Check Version
    runs-on: ubuntu-latest

    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      new_version: ${{ steps.check.outputs.new_version }}
      release_tag: ${{ steps.check.outputs.release_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Check if Version Changed
        id: check
        run: |
          # Manual trigger with explicit version: use it directly
          if [ -n "${{ inputs.version }}" ]; then
            RELEASE_TAG="v${{ inputs.version }}"

            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
            echo "📦 Manual dispatch — using version ${{ inputs.version }}"
            exit 0
          fi

          CURRENT_VERSION=$(grep -oP '(?<=^## \[)\d+\.\d+\.\d+(?=\])' CHANGELOG.md | head -n 1)
          PROJECT_VERSION=$(grep -oP '(?<=^version = ")[^"]+' pyproject.toml | head -n 1)

          if [ "$CURRENT_VERSION" != "$PROJECT_VERSION" ]; then
            echo "❌ Version mismatch: CHANGELOG.md ($CURRENT_VERSION) != pyproject.toml ($PROJECT_VERSION)"
            exit 1
          fi

          echo "release_tag=v$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Manual dispatch auto-detected from source.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "📦 Manual dispatch — auto-detected version $CURRENT_VERSION"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$CURRENT_VERSION" >/dev/null; then
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "⏭️ Version $CURRENT_VERSION already has a release tag. Skipping publish pipeline."
            exit 0
          fi

          echo "version_changed=true" >> $GITHUB_OUTPUT
          echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Versions match ($CURRENT_VERSION) and release tag is missing. Triggering publish pipeline."

  build_package:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: check_version
    if: needs.check_version.outputs.version_changed == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build Package
        run: uv build

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish_container:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs:
      - check_version
      - publish_pypi
    if: needs.check_version.outputs.version_changed == 'true' && needs.publish_pypi.result == 'success' && (github.event_name != 'workflow_dispatch' || (inputs.skip_docker != true && inputs.skip_docker != 'true'))

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image repository
        id: repo
        run: echo "image_repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker Metadata (API)
        id: meta_api
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.repo.outputs.image_repo }}
          tags: |
            type=raw,value=v${{ needs.check_version.outputs.new_version }}
            type=raw,value=${{ needs.check_version.outputs.new_version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.check_version.outputs.new_version }}
            type=semver,pattern={{major}},value=v${{ needs.check_version.outputs.new_version }}
            type=raw,value=latest

      - name: Build and Push Docker Image (API)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Docker Metadata (MCP)
        id: meta_mcp
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.repo.outputs.image_repo }}
          tags: |
            type=raw,value=mcp
            type=raw,value=${{ needs.check_version.outputs.new_version }}-mcp
            type=raw,value=v${{ needs.check_version.outputs.new_version }}-mcp

      - name: Build and Push Docker Image (MCP)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile.mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_mcp.outputs.tags }}
          labels: ${{ steps.meta_mcp.outputs.labels }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

  publish_pypi:
    name: Publish PyPI
    runs-on: ubuntu-latest
    needs:
      - check_version
      - build_package
      - create_github_release
    if: needs.check_version.outputs.version_changed == 'true' && needs.create_github_release.result == 'success' && (github.event_name != 'workflow_dispatch' || (inputs.skip_pypi != true && inputs.skip_pypi != 'true'))

    permissions:
      id-token: write

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Download Package Artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish dist/*

  create_github_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - check_version
      - build_package
    if: needs.check_version.outputs.version_changed == 'true' && (github.event_name != 'workflow_dispatch' || (inputs.skip_gh_releases != true && inputs.skip_gh_releases != 'true'))

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Release Tag
        shell: bash
        run: |
          TAG="${{ needs.check_version.outputs.release_tag }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
            echo "Release tag $TAG already exists at $(git rev-list -n 1 "$TAG")"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "${{ github.sha }}" -m "$TAG"
          git push origin "refs/tags/$TAG"
          echo "Created release tag $TAG at ${{ github.sha }}"

      - name: Download Package Artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Generate Release Notes
        id: release_body
        run: |
          VERSION="v${{ needs.check_version.outputs.new_version }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          IMAGE_REPO="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          awk -v heading="## [${VERSION#v}]" '
            index($0, heading) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::error::No changelog section found for ${VERSION}"
            exit 1
          fi

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.skip_docker }}" != "true" ]; then
            echo "" >> release_notes.md
            echo "### 🐳 Docker Images" >> release_notes.md
            echo "" >> release_notes.md
            echo "#### API" >> release_notes.md
            echo "" >> release_notes.md
            echo "\`\`\`bash" >> release_notes.md
            echo "docker run --rm -p 8000:8000 $IMAGE_REPO:${{ needs.check_version.outputs.new_version }}" >> release_notes.md
            echo "\`\`\`" >> release_notes.md
            echo "" >> release_notes.md
            echo "#### MCP" >> release_notes.md
            echo "" >> release_notes.md
            echo "\`\`\`bash" >> release_notes.md
            echo "docker run --rm -e PERPLEXITY_SESSION_TOKEN=your_token $IMAGE_REPO:${{ needs.check_version.outputs.new_version }}-mcp" >> release_notes.md
            echo "\`\`\`" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "### 👥 Contributors" >> release_notes.md
          echo "" >> release_notes.md

          LOGINS=$(git log "$PREVIOUS_TAG".."$VERSION" --format='%H' | while read -r sha; do
            curl -s "https://api.github.com/repos/${{ github.repository }}/commits/$sha" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              | grep -oP '(?<="login": ")[^"]+' | head -1
          done | sort -u | awk 'NF && $0 !~ /\[bot\]/')

          if [ -n "$LOGINS" ]; then
            AVATARS=""
            for login in $LOGINS; do
              AVATARS="$AVATARS<a href=\"https://github.com/$login\"><img src=\"https://wsrv.nl/?url=github.com/$login.png&w=40&h=40&mask=circle\" width=\"40\" height=\"40\" alt=\"@$login\" /></a>&nbsp;"
            done
            echo "$AVATARS" >> release_notes.md
          else
            echo "_No contributors found._" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "<br>" >> release_notes.md
          echo "" >> release_notes.md
          echo "<details open>" >> release_notes.md
          echo "<summary><b>📦 Commits History (${PREVIOUS_TAG} &rarr; ${VERSION})</b></summary>" >> release_notes.md
          echo "" >> release_notes.md
          git log --reverse --date=iso-strict --max-count=50 --format="- [\`%h\`](https://github.com/${{ github.repository }}/commit/%H) - %ad - %s" "$PREVIOUS_TAG".."$VERSION" >> release_notes.md
          echo "" >> release_notes.md
          echo "</details>" >> release_notes.md
          echo "" >> release_notes.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...$VERSION" >> release_notes.md

          {
            echo "notes<<EOF"
            cat release_notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check_version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.check_version.outputs.release_tag }}
          body: ${{ steps.release_body.outputs.notes }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
