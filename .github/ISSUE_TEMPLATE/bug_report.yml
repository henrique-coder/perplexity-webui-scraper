name: Bug report
description: Report reproducible behavior that appears to be broken.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include session tokens, cookies, account IDs, private prompts, or private files.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest code sample, CLI command, or API request that reproduces the issue.
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Error output
      description: Paste the full traceback or response error with secrets removed.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "e.g. 1.1.3"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.x, 3.12.x, 3.13.x, or 3.14.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04, macOS 15, Windows 11, container, etc."
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      multiple: true
      options:
        - Python API
        - CLI
        - REST API
        - MCP server
        - Container
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I am using the latest available version.
          required: true
        - label: I removed all tokens, cookies, private prompts, and account data from this issue.
          required: true
        - label: I searched existing issues before opening this report.
          required: true
