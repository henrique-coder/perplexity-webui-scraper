# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    build:
      html:
        - zensical build --clean --strict
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -a site/. "$READTHEDOCS_OUTPUT/html/"

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
