[build-system]
requires = [
    "uv_build>=0.12.0, <0.13.0",
]
build-backend = "uv_build"

[project]
name = "perplexity-webui-scraper"
version = "1.1.6"
description = "Python client, CLI, MCP server, and OpenAI-compatible REST API for Perplexity's WebUI."
authors = [
    { name = "Henrique Moreira", email = "78804989+henrique-coder@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.11, <3.15"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "ai",
    "fastapi",
    "mcp",
    "openai-compatible",
    "perplexity",
    "scraper",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "curl-cffi>=0.16.0",
    "loguru>=0.7.0",
    "orjson>=3.12.0",
    "pydantic>=2.12.0, <3.0.0",
    "typer>=0.20.0",
]

[project.scripts]
perplexity-webui-scraper = "perplexity_webui_scraper.cli.__main__:main"

[project.urls]
Changelog = "https://github.com/henrique-coder/perplexity-webui-scraper/blob/prod/CHANGELOG.md"
Discussions = "https://github.com/henrique-coder/perplexity-webui-scraper/discussions"
Documentation = "https://henrique-coder.github.io/perplexity-webui-scraper"
Funding = "https://github.com/sponsors/henrique-coder"
Homepage = "https://github.com/henrique-coder/perplexity-webui-scraper"
Issues = "https://github.com/henrique-coder/perplexity-webui-scraper/issues"
Repository = "https://github.com/henrique-coder/perplexity-webui-scraper.git"
Security = "https://github.com/henrique-coder/perplexity-webui-scraper/security/policy"

[project.optional-dependencies]
all = [
    "perplexity-webui-scraper[api,cli,mcp]",
]
api = [
    "fastapi>=0.120.0",
    "rich>=13.0.0",
    "uvicorn[standard]>=0.30.0",
]
cli = [
    "cryptography>=50.0.0, <51.0.0",
    "platformdirs>=4.0.0",
    "pyperclip>=1.9.0",
    "rich>=13.0.0",
]
mcp = [
    "fastmcp>=3.0.0",
]

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "hooks" },
    { include-group = "lint" },
    { include-group = "test" },
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.7.0",
    "mkdocstrings[python]>=1.0.0",
    "ruff>=0.16.0",
]
hooks = [
    "prek>=0.4.0",
]
lint = [
    { include-group = "workflow" },
    "ruff>=0.16.0",
    "ty>=0.0.60",
]
test = [
    "cryptography>=50.0.0, <51.0.0",
    "fastapi>=0.120.0",
    "fastmcp>=3.0.0",
    "niquests>=3.20.0",
    "platformdirs>=4.0.0",
    "pyperclip>=1.9.0",
    "pytest>=8.0.0",
    "rich>=13.0.0",
]
workflow = [
    "zizmor>=1.28.0",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "D",
    "E",
    "ERA",
    "F",
    "FA",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "T20",
    "TCH",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "ANN401",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D213",
    "G004",
    "ISC001",
    "PLE1205",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "TRY003",
    "TRY301",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true
allow-star-arg-any = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["perplexity_webui_scraper"]
lines-after-imports = 2
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.rules]
division-by-zero = "warn"
index-out-of-bounds = "warn"
invalid-argument-type = "error"
invalid-return-type = "error"
missing-argument = "error"
possibly-missing-attribute = "warn"
redundant-cast = "warn"
too-many-positional-arguments = "error"
unresolved-attribute = "error"
unresolved-import = "error"
unused-ignore-comment = "warn"
unsupported-operator = "error"
